services:
  node1:
    environment: &tracing
      GODB_OTLP_HTTP_ENDPOINT: http://tempo:4318/v1/traces
      GODB_TRACE_SAMPLE_RATIO: ${GODB_TRACE_SAMPLE_RATIO:-0.1}
  node2:
    environment: *tracing
  node3:
    environment: *tracing

  tempo-init:
    image: alpine:3.24.0
    restart: "no"
    network_mode: none
    command: [sh, -c, "chown 10001:10001 /var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:3.1.1
    user: "10001:10001"
    restart: unless-stopped
    command: [-target=all, -config.file=/etc/tempo.yaml]
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    volumes:
      - ./deploy/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    volumes:
      - ./deploy/tempo/datasource.yml:/etc/grafana/provisioning/datasources/tempo.yml:ro

volumes:
  tempo-data:
