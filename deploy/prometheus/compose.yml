global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/compose-alerts.yml

scrape_configs:
  - job_name: godb
    dns_sd_configs:
      - names: [node1, node2, node3]
        type: A
        port: 9091
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: '(node[123])\.?'
        target_label: member
        replacement: '$1'
      - source_labels: [member]
        target_label: instance
        replacement: '${1}:9091'
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
