name: "Run Lint"

on:
  push:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'v1.27'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
